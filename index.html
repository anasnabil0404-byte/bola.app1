<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بولا الوسيم</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5e1c7;
            background-image: 
                radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.25) 100%),
                radial-gradient(rgba(0, 0, 0, 0.15) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 18px 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            color: #f5e1c7;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background-color: #6b2b2e;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(245, 225, 199, 0.25);
            max-width: 380px;
            z-index: 2;
            position: relative;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 21px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            color: #f5e1c7;
            letter-spacing: 0.5px;
        }

        .image-btn-wrapper {
            position: relative;
            display: inline-block;
        }

        .image-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            border-radius: 50%;
            overflow: hidden;
            width: 170px;
            height: 170px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            display: block;
            border: 4px solid #f5e1c7;
            position: relative;
            z-index: 3;
        }

        .image-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-btn:hover {
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
        }

        .image-btn:hover img {
            transform: scale(1.08);
        }

        .image-btn.clicked {
            animation: popBtn 0.3s ease;
        }

        @keyframes popBtn {
            0% { transform: scale(1); }
            50% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }

        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 170px;
            height: 170px;
            margin-top: -85px;
            margin-left: -85px;
            border-radius: 50%;
            border: 2px solid rgba(107, 43, 46, 0.6);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 1;
            animation: rippleExpand 0.8s ease-out forwards;
        }

        @keyframes rippleExpand {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .flying-word {
            position: absolute;
            font-size: 28px;
            font-weight: 800;
            color: #f5e1c7;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            animation: floatUpWord 1.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatUpWord {
            0% { opacity: 0; transform: translateY(10px) scale(0.4) rotate(var(--rot-start)); }
            20% { opacity: 1; transform: translateY(-40px) scale(1.25) rotate(var(--rot-mid)); }
            100% { opacity: 0; transform: translateY(-220px) scale(0.9) rotate(var(--rot-end)); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>دوس على صورة بولا الوسيم</h1>
        
        <div class="image-btn-wrapper" id="btnWrapper">
            <button class="image-btn" id="playSoundBtn" title="اضغط لتشغيل الصوت">
                <img src="img.jpg" alt="بولا الوسيم" onerror="this.src='boulos.jpg';">
            </button>
        </div>
    </div>

    <script>
        const btn = document.getElementById('playSoundBtn');
        const btnWrapper = document.getElementById('btnWrapper');
        const sentenceWords = ['ايس', 'كريم', 'اخد', 'انا', 'بولا'];

        btn.addEventListener('click', function(e) {
            btn.classList.remove('clicked');
            void btn.offsetWidth;
            btn.classList.add('clicked');

            createRipple();

            const audio = new Audio('sound.mp3');
            audio.currentTime = 0;
            audio.play().catch(error => {
                console.log("خطأ في تشغيل الصوت:", error);
            });

            createFlyingWords();
        });

        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            btnWrapper.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 800);
        }

        function createFlyingWords() {
            const rect = btn.getBoundingClientRect();

            sentenceWords.forEach((word, index) => {
                setTimeout(() => {
                    const wordElem = document.createElement('div');
                    wordElem.className = 'flying-word';
                    wordElem.innerText = word;

                    const rotStart = (Math.random() * 20 - 10) + 'deg';
                    const rotMid = (Math.random() * 30 - 15) + 'deg';
                    const rotEnd = (Math.random() * 40 - 20) + 'deg';

                    wordElem.style.setProperty('--rot-start', rotStart);
                    wordElem.style.setProperty('--rot-mid', rotMid);
                    wordElem.style.setProperty('--rot-end', rotEnd);

                    const offsetX = (Math.random() - 0.5) * 180;
                    const offsetY = (Math.random() - 0.5) * 40;

                    wordElem.style.left = (rect.left + rect.width / 2 + offsetX) + 'px';
                    wordElem.style.top = (rect.top + rect.height / 2 + offsetY) + 'px';

                    document.body.appendChild(wordElem);

                    setTimeout(() => {
                        wordElem.remove();
                    }, 1700);
                }, index * 110);
            });
        }
    </script>

</body>
</html>
